---
# Cluster coordinates. Injected per-environment (e.g. by the workshop-do
# per-workshop values file, or a provisioning role).
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443

showroom:
  # Namespace the showroom is deployed into. The chart creates it.
  namespace: showroom

  # Content source: the workshop showroom repo the git-cloner clones and
  # antora-builder builds.
  gitRepoUrl: https://github.com/rhpds/zt-slug-showroom
  gitRepoRef: main
  antoraPlaybook: site.yml

  # Nookbag ("zero-touch") UI bundle used by the showroom-content container.
  ztBundle: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.3.6/nookbag-v0.3.6.zip
  ztUiEnabled: "true"

  # Lab identity surfaced to the content via env + user_data.yml.
  guid: workshop
  user: user1
  password: openshift
  projectName: demo

  # cluster-setup init container patches the default IngressController to strip
  # X-Frame-Options / Content-Security-Policy so the showroom iframe renders.
  # Requires the showroom-cluster-setup ClusterRole (cluster-scoped patch).
  clusterSetup:
    enabled: true

  rbac:
    # Bind ClusterRole/edit to the showroom ServiceAccount in its namespace so
    # lab exercises run from the wetty terminal can manage namespace resources.
    namespaceEdit: true

  # wetty web terminal. SSHes into a bastion; coordinates are environment
  # specific. NOTE: sshPass is rendered as a container arg (matches the live
  # showroom runtime); treat it as sensitive.
  wetty:
    sshHost: ssh.example.com
    sshPort: "22"
    sshUser: lab-user
    sshAuth: password
    sshPass: changeme

  images:
    oseCli: registry.redhat.io/openshift4/ose-cli:latest
    gitCloner: quay.io/rhpds/git-cloner:v1.1.5
    antora: quay.io/rhpds/antora:v1.3.0
    content: quay.io/rhpds/showroom-content:v1.4.2
    nginx: quay.io/rhpds/nginx:1.25
    wetty: quay.io/rhpds/wetty:v2.7.6
